name: Feature request
description: Suggest an improvement for the open-source project.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem before proposing a solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed direction }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Ingestion, Map and replay, Device management, Deployment, Documentation, Accessibility, Other]
