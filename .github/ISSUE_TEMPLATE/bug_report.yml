name: Bug report
description: Report a reproducible problem in uplotr.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets, API keys, exact coordinates, and private payloads before posting.
  - type: input
    id: version
    attributes:
      label: uplotr version
      placeholder: v0.2.0-beta.1 or commit SHA
    validations: { required: true }
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Vercel, Local development, Other]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Sanitized logs or screenshots }
