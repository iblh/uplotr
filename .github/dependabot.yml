version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # prisma (CLI, a devDependency) and @prisma/client (a dependency) must be
      # upgraded together: a mismatched pair fails `prisma generate` in postinstall.
      # This group is listed first so it wins over the dependency-type groups below.
      prisma:
        patterns: ["prisma", "@prisma/*"]
      production-dependencies:
        dependency-type: production
        exclude-patterns: ["prisma", "@prisma/*"]
      development-dependencies:
        dependency-type: development
        exclude-patterns: ["prisma", "@prisma/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
