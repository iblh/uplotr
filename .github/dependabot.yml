version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # prisma (CLI, a devDependency) and @prisma/client (a dependency) must be
      # upgraded together: a mismatched pair fails `prisma generate` in postinstall.
      # This group is listed first so it wins over the dependency-type groups below.
      prisma:
        patterns: ["prisma", "@prisma/*"]
      production-dependencies:
        dependency-type: production
        exclude-patterns: ["prisma", "@prisma/*"]
      development-dependencies:
        dependency-type: development
        exclude-patterns: ["prisma", "@prisma/*"]
    ignore:
      # react-map-gl v8 (@vis.gl/react-maplibre) cannot render with maplibre-gl
      # 6.x: the map constructs and the style parses, but it never reaches
      # `loaded`, so no basemap tiles are requested and the map is blank.
      # maplibre-gl is pinned to 5.24.0 in package.json; see pnpm-workspace.yaml
      # for the matching CVE-2026-85061 exemption and its removal condition.
      # REMOVE THIS IGNORE once react-map-gl renders with maplibre-gl >= 6.4.1.
      - dependency-name: maplibre-gl
        versions: [">=6.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
